public class BukuTamu {
    private static final String NAMA_FILE = "tamu.txt";
    
    // Tambahkan tamu baru ke file (mode append)
    public static void tambahTamu(String nama, String pesan) throws IOException {
        try (PrintWriter pw = new PrintWriter(
                new BufferedWriter(new FileWriter(NAMA_FILE, true)))) {
            pw.println("Nama  : " + nama);
            pw.println("Pesan : " + pesan);
            pw.println("---");
        }
        System.out.println("Tamu '" + nama + "' berhasil dicatat!");
    }
    
    // Tampilkan semua tamu dari file
    public static void tampilkanTamu() throws IOException {
        File file = new File(NAMA_FILE);
        if (!file.exists() || file.length() == 0) {
            System.out.println("Belum ada tamu yang terdaftar.");
            return;
        }
        
        System.out.println("\\n=== Daftar Tamu ===");
        try (BufferedReader br = new BufferedReader(new FileReader(NAMA_FILE))) {
            String baris;
            while ((baris = br.readLine()) != null) {
                System.out.println(baris);
            }
        }
    }

        // Tampilkan semua tamu

            pw.println("Andi Pratama,12001,85,90,88");

            pw.println("Dina Rahayu,12004,80,85,83");
        }
        System.out.println("File CSV dibuat.");
    }
    
    static void prosesCsvKeLaporan(String inputCSV, String outputTxt)

            PrintWriter    pw = new PrintWriter(new BufferedWriter(
                                    new FileWriter(outputTxt)))
        ) {

            pw.printf("%-18s %-10s %s%n", "Nama", "NIM", "Rata-rata");
            pw.println("-".repeat(40));
            
            String baris;
            double totalSeluruh = 0;
            int jumlahMahasiswa = 0;
            
            while ((baris = br.readLine()) != null) {
                String[] kolom = baris.split(",");
                
                String nama = kolom[0];
                String nim  = kolom[1];

                double n2   = Double.parseDouble(kolom[3]);

                pw.printf("%-18s %-10s %.2f%n", nama, nim, rata);
                
                totalSeluruh += rata;
                jumlahMahasiswa++;
            }

            pw.printf("Rata-rata kelas: %.2f%n", totalSeluruh / jumlahMahasiswa);

public class DataStreamLengkap {
    private static final String NAMA_FILE = "datamahasiswa.bin";

    public static void simpanData(String nama, int nim, double ipk) throws IOException {
        // Mode append: tambah data baru tanpa menghapus yang lama
        try (DataOutputStream out = new DataOutputStream(
                new FileOutputStream(NAMA_FILE, true))) {
            out.writeUTF(nama);
            out.writeInt(nim);
            out.writeDouble(ipk);
        }
        System.out.println("Data '" + nama + "' berhasil disimpan.");
    }

    public static void bacaSemuaData() throws IOException {
        File file = new File(NAMA_FILE);
        if (!file.exists() || file.length() == 0) {
            System.out.println("Belum ada data.");
            return;
        }

        System.out.println("\\n=== Data Mahasiswa ===");
        System.out.printf("%-20s %-10s %s%n", "Nama", "NIM", "IPK");
        System.out.println("-".repeat(40));

        try (DataInputStream in = new DataInputStream(
                new FileInputStream(NAMA_FILE))) {
            // Terus baca sampai EOF
            while (in.available() > 0) {
                String nama  = in.readUTF();
                int    nim   = in.readInt();
                double ipk   = in.readDouble();
                System.out.printf("%-20s %-10d %.2f%n", nama, nim, ipk);
            }
        }
    }

    public static void main(String[] args) throws IOException {
        simpanData("Andi Pratama",  12001, 3.85);
        simpanData("Budi Santoso",  12002, 3.72);
        simpanData("Citra Dewi",    12003, 3.91);

        bacaSemuaData();
    }

import java.io.*;

public class CekStatusURL {
    public static void cekURL(String urlStr) {
        try {
            URL url = new URL(urlStr);
            HttpURLConnection conn = (HttpURLConnection) url.openConnection();

            // Set timeout agar tidak hang terlalu lama
            conn.setConnectTimeout(5000); // 5 detik
            conn.setReadTimeout(5000);
            conn.setRequestMethod("GET");

            int statusCode = conn.getResponseCode();
            String statusMsg = conn.getResponseMessage();
            long contentLength = conn.getContentLengthLong();

            System.out.println("URL    : " + urlStr);
            System.out.println("Status : " + statusCode + " " + statusMsg);
            System.out.println("Ukuran : " + (contentLength > 0 ? contentLength + " bytes" : "tidak diketahui"));
            System.out.println("Tipe   : " + conn.getContentType());
            System.out.println();

            conn.disconnect();

        } catch (MalformedURLException e) {

            try {

/**
 * LATIHAN 2: Download File Paralel
 * Simulasi download beberapa file secara bersamaan menggunakan Callable & Future.
 * Tampilkan progress dan total waktu.
 */
public class DownloadParalel {

    // Simulasi download satu file
    static String downloadFile(String namaFile, int ukuranMB)
            throws InterruptedException {
        long mulai = System.currentTimeMillis();
        System.out.println("Mulai download: " + namaFile
                + " (" + ukuranMB + " MB)");

        // Simulasi: setiap 1 MB butuh 200ms
        for (int mb = 1; mb <= ukuranMB; mb++) {
            Thread.sleep(200);
            System.out.printf("  %s: %d/%d MB%n", namaFile, mb, ukuranMB);
        }

        long selesai = System.currentTimeMillis();
        return String.format("✓ %s selesai dalam %.1f detik",
                namaFile, (selesai - mulai) / 1000.0);
    }

    public static void main(String[] args) throws Exception {
        // File yang akan di-download
        String[] files  = {"video.mp4", "dokumen.pdf", "gambar.zip",
                           "musik.mp3", "backup.tar"};
        int[] ukuran    = {5, 2, 4, 1, 3}; // ukuran dalam MB (simulasi)

        ExecutorService executor = Executors.newFixedThreadPool(3);
        List<Future<String>> futures = new ArrayList<>();

        long mulai = System.currentTimeMillis();

        // Submit semua download
        for (int i = 0; i < files.length; i++) {
            final String file = files[i];
            final int size = ukuran[i];
            Future<String> future = executor.submit(
                () -> downloadFile(file, size)
            );
            futures.add(future);
        }

        // Kumpulkan hasil
        System.out.println("\\n=== HASIL DOWNLOAD ===");
        for (Future<String> f : futures) {
            System.out.println(f.get()); // Tunggu setiap file selesai
        }

        executor.shutdown();
        long total = System.currentTimeMillis() - mulai;
        System.out.printf("\\nTotal waktu: %.1f detik%n", total / 1000.0);
    }

import java.util.*;

/**
 * LATIHAN 3: Pencarian Paralel dalam Array Besar
 * Bagi array besar ke beberapa bagian, cari nilai maksimum di masing-masing
 * bagian secara paralel, lalu gabungkan hasilnya.
 */
public class CariMaksimumParalel {
    static final int UKURAN = 10_000_000; // 10 juta elemen
    static final int JUMLAH_THREAD = 4;

    public static void main(String[] args) throws Exception {
        // Buat array acak
        System.out.println("Membuat array " + UKURAN + " elemen...");
        int[] data = new int[UKURAN];
        Random rng = new Random(42);
        for (int i = 0; i < UKURAN; i++) data[i] = rng.nextInt(1_000_000);

        // --- CARA 1: Sequential ---
        long t1 = System.currentTimeMillis();
        int maxSeq = Integer.MIN_VALUE;
        for (int x : data) if (x > maxSeq) maxSeq = x;
        long t2 = System.currentTimeMillis();
        System.out.printf("Sequential: max=%d, waktu=%dms%n", maxSeq, t2 - t1);

        // --- CARA 2: Paralel dengan Callable ---
        int bagian = UKURAN / JUMLAH_THREAD;
        ExecutorService executor = Executors.newFixedThreadPool(JUMLAH_THREAD);
        List<Future<Integer>> futures = new ArrayList<>();

        long t3 = System.currentTimeMillis();

        for (int i = 0; i < JUMLAH_THREAD; i++) {
            final int awal = i * bagian;
            final int akhir = (i == JUMLAH_THREAD - 1) ? UKURAN : awal + bagian;
            futures.add(executor.submit(() -> {
                int localMax = Integer.MIN_VALUE;
                for (int j = awal; j < akhir; j++)
                    if (data[j] > localMax) localMax = data[j];
                return localMax;
            }));
        }

        // Gabungkan hasil dari semua thread
        int maxParalel = Integer.MIN_VALUE;
        for (Future<Integer> f : futures) {
            int val = f.get();
            if (val > maxParalel) maxParalel = val;
        }

        long t4 = System.currentTimeMillis();
        System.out.printf("Paralel (%d thread): max=%d, waktu=%dms%n",
                JUMLAH_THREAD, maxParalel, t4 - t3);

        executor.shutdown();
    }

import java.net.*;

/**
 * LATIHAN 1: Server Kalkulator TCP
 * Server menerima dua angka dan operator dari client,
 * menghitung hasilnya, dan mengembalikan hasil ke client.
 * Format pesan: "angka1 operator angka2" (contoh: "10 + 5")
 * Ketik "**CLOSE**" untuk mengakhiri koneksi.
 */
public class KalkulatorServer {
    private static ServerSocket serverSocket;
    private static final int PORT = 5678;

    public static void main(String[] args) {
        System.out.println("Kalkulator Server berjalan di port " + PORT);
        try {
            serverSocket = new ServerSocket(PORT);
        } catch (IOException ioEx) {
            System.out.println("Tidak bisa membuka port!");
            System.exit(1);
        }
        do {
            handleClient();
        } while (true);
    }

    private static void handleClient() {
        Socket link = null;
        try {
            link = serverSocket.accept();
            System.out.println("Client terhubung: " + link.getInetAddress());
            Scanner input = new Scanner(link.getInputStream());
            PrintWriter output = new PrintWriter(link.getOutputStream(), true);

            String pesan = input.nextLine();
            while (!pesan.equals("**CLOSE**")) {
                String hasil = hitung(pesan);
                output.println(hasil);
                pesan = input.nextLine();
            }
            output.println("Koneksi ditutup.");
        } catch (IOException ioEx) {
            ioEx.printStackTrace();
        } finally {
            try {
                if (link != null) link.close();
            } catch (IOException ioEx) {
                System.exit(1);
            }
        }
    }

    private static String hitung(String ekspresi) {
        try {
            String[] bagian = ekspresi.split(" ");
            double a = Double.parseDouble(bagian[0]);
            String op = bagian[1];
            double b = Double.parseDouble(bagian[2]);
            double hasil;
            switch (op) {
                case "+": hasil = a + b; break;
                case "-": hasil = a - b; break;
                case "*": hasil = a * b; break;
                case "/":
                    if (b == 0) return "Error: Pembagi tidak boleh nol";
                    hasil = a / b; break;
                default: return "Error: Operator tidak dikenal";
            }
            return ekspresi + " = " + hasil;
        } catch (Exception e) {
            return "Error: Format salah. Gunakan: angka operator angka";
        }
    }

import java.net.*;
import java.util.*;
import java.util.concurrent.*;

/**
 * LATIHAN 2: Multi-Client Chat Server (menggunakan Thread)
 * Server dapat melayani beberapa client sekaligus.
 * Setiap client yang terhubung mendapat thread terpisah.
 */
public class MultiClientServer {
    private static final int PORT = 7777;
    private static List<PrintWriter> semuaClient =
            Collections.synchronizedList(new ArrayList<>());

    public static void main(String[] args) throws IOException {
        ServerSocket serverSocket = new ServerSocket(PORT);
        System.out.println("Multi-Client Server berjalan di port " + PORT);
        ExecutorService pool = Executors.newCachedThreadPool();
        while (true) {
            Socket client = serverSocket.accept();
            pool.execute(new HandlerClient(client));
        }
    }

    static class HandlerClient implements Runnable {
        private Socket socket;
        private PrintWriter out;

        HandlerClient(Socket socket) { this.socket = socket; }

        public void run() {
            try {
                Scanner in = new Scanner(socket.getInputStream());
                out = new PrintWriter(socket.getOutputStream(), true);
                semuaClient.add(out);
                System.out.println("Client baru terhubung. Total: " + semuaClient.size());

                while (in.hasNextLine()) {
                    String pesan = in.nextLine();
                    if (pesan.equals("**CLOSE**")) break;
                    broadcast("[Client] " + pesan);
                }
            } catch (IOException e) {
                System.out.println("Client terputus.");
            } finally {
                semuaClient.remove(out);
                try { socket.close(); } catch (IOException e) {}
            }
        }

        private void broadcast(String pesan) {
            for (PrintWriter pw : semuaClient) {
                pw.println(pesan);
            }
        }
    }

uhuServer.java",children:`import java.net.*;
import java.io.*;

/**
 * LATIHAN 1: Server Konversi Suhu UDP
 * Server menerima nilai suhu dalam Celsius dari client,
 * mengkonversinya ke Fahrenheit dan Kelvin, lalu mengirim
 * hasilnya kembali ke client.
 * Ketik "**CLOSE**" untuk mengakhiri.
 */
public class KonversiSuhuServer {
    private static final int PORT = 5555;
    private static DatagramSocket socket;
    private static byte[] buffer;

    public static void main(String[] args) {
        System.out.println("Server Konversi Suhu UDP berjalan di port " + PORT);
        try {
            socket = new DatagramSocket(PORT);
        } catch (SocketException e) {
            System.out.println("Tidak bisa membuka port!");
            System.exit(1);
        }
        handleClient();
    }

    private static void handleClient() {
        try {
            while (true) {
                buffer = new byte[256];
                DatagramPacket inPacket = new DatagramPacket(buffer, buffer.length);
                socket.receive(inPacket);

                InetAddress clientAddr = inPacket.getAddress();
                int clientPort = inPacket.getPort();
                String pesan = new String(inPacket.getData(), 0, inPacket.getLength());

                if (pesan.equals("**CLOSE**")) {
                    System.out.println("Client meminta tutup koneksi.");
                    break;
                }

                String hasil = konversi(pesan);
                System.out.println("Diterima: " + pesan + "°C → " + hasil);

                byte[] dataKirim = hasil.getBytes();
                DatagramPacket outPacket = new DatagramPacket(
                        dataKirim, dataKirim.length, clientAddr, clientPort);
                socket.send(outPacket);
            }
        } catch (IOException e) {
            e.printStackTrace();
        } finally {
            System.out.println("Server ditutup.");
            socket.close();
        }
    }

    private static String konversi(String input) {
        try {
            double celsius = Double.parseDouble(input.trim());
            double fahrenheit = (celsius * 9.0 / 5.0) + 32;
            double kelvin = celsius + 273.15;
            return String.format("%.2f°C = %.2f°F = %.2fK",
                    celsius, fahrenheit, kelvin);
        } catch (NumberFormatException e) {
            return "Error: Masukkan angka yang valid";
        }
    }
}`}),a.jsx("h4",{children:"Client — KonversiSuhuClient.java"}),a.jsx(O,{language:"Java",filename:"KonversiSuhuClient.java",children:`import java.net.*;

public class UDPPacketLossSimulation {
    private static final int PORT = 9999;
    private static final int TOTAL_PAKET = 20;

    // Jalankan sebagai: java UDPPacketLossSimulation server

            DatagramPacket p = new DatagramPacket(buf, buf.length);
            socket.receive(p);
            String isi = new String(p.getData(), 0, p.getLength());

        }
        System.out.println("Selesai menerima " + diterima + " paket.");
        socket.close();
    }

    static void jalankanClient() throws Exception {
        DatagramSocket socket = new DatagramSocket();
        InetAddress host = InetAddress.getLocalHost();
        System.out.println("Mengirim " + TOTAL_PAKET + " paket ke server...");

            String pesan = String.valueOf(i);
            byte[] data = pesan.getBytes();
            DatagramPacket p = new DatagramPacket(data, data.length, host, PORT);
            socket.send(p);
            System.out.println("Kirim paket #" + i);
            Thread.sleep(100); // jeda antar paket
        }
        System.out.println("Semua paket terkirim (dari sisi client).");

/**
 * LATIHAN 1: Simulasi ATM Multithreaded
 * Beberapa pengguna mengakses rekening yang sama secara bersamaan.
 * Pastikan tidak terjadi race condition pada saldo.
 */
public class SimulasiATM {
    static class Rekening {
        private final String nomor;
        private double saldo;

        public Rekening(String nomor, double saldoAwal) {
            this.nomor = nomor;
            this.saldo = saldoAwal;
        }

        // Thread-safe: gunakan synchronized
        public synchronized boolean tarik(double jumlah, String pengguna) {
            if (saldo < jumlah) {
                System.out.printf("[%s] GAGAL tarik %.0f — saldo hanya %.0f%n",
                        pengguna, jumlah, saldo);
                return false;
            }
            saldo -= jumlah;
            System.out.printf("[%s] Tarik %.0f → Saldo tersisa: %.0f%n",
                    pengguna, jumlah, saldo);
            return true;
        }

        public synchronized void setor(double jumlah, String pengguna) {
            saldo += jumlah;
            System.out.printf("[%s] Setor %.0f → Saldo menjadi: %.0f%n",
                    pengguna, jumlah, saldo);
        }

        public synchronized double getSaldo() { return saldo; }
        public String getNomor() { return nomor; }
    }

    public static void main(String[] args) throws InterruptedException {
        Rekening rekening = new Rekening("BCA-001", 1_000_000);
        System.out.println("Saldo awal: " + rekening.getSaldo());

        ExecutorService executor = Executors.newFixedThreadPool(5);

        // Simulasi 10 transaksi bersamaan
        String[] pengguna = {"Alice", "Bob", "Cici", "Dani", "Eko",
                             "Fani", "Gita", "Hani", "Iwan", "Juni"};
        double[] transaksi = {200_000, 150_000, 300_000, 100_000, 250_000,
                               80_000, 200_000, 120_000,  50_000, 100_000};
        boolean[] jenisTabung = {true, false, true, false, true,
                                 false, true, false, true, false};
        // true = setor, false = tarik

        for (int i = 0; i < pengguna.length; i++) {
            final String nama = pengguna[i];
            final double jumlah = transaksi[i];
            final boolean setor = jenisTabung[i];
            executor.submit(() -> {
                if (setor) {
                    rekening.setor(jumlah, nama);
                } else {
                    rekening.tarik(jumlah, nama);
                }
            });
        }

        executor.shutdown();
        executor.awaitTermination(30, TimeUnit.SECONDS);

        System.out.println("\\nSaldo akhir: " + rekening.getSaldo());
        // Hitung ekspektasi manual dan verifikasi!
    }

import java.util.*;

/**
 * LATIHAN 2: Sistem Antrian Cetak (Printer Queue)
 * Banyak komputer mengirim dokumen ke satu printer.
 * Printer hanya bisa mencetak satu dokumen pada satu waktu.
 * Gunakan BlockingQueue agar tidak ada race condition.
 */
public class PrinterQueue {
    static class Dokumen {
        private final String nama;
        private final String pengirim;
        private final int halaman;

        public Dokumen(String nama, String pengirim, int halaman) {
            this.nama = nama;
            this.pengirim = pengirim;
            this.halaman = halaman;
        }

        @Override
        public String toString() {
            return String.format("'%s' (%d hal) dari %s", nama, halaman, pengirim);
        }
    }

    // BlockingQueue sudah thread-safe — tidak perlu synchronized manual
    static BlockingQueue<Dokumen> antrean = new LinkedBlockingQueue<>(10);
    static volatile boolean selesai = false;
    static int totalDicetak = 0;

    // Printer thread — mengambil dari antrian dan mencetak
    static void jalankanPrinter() {
        System.out.println("🖨️ Printer siap...");
        while (!selesai || !antrean.isEmpty()) {
            try {
                // Poll dengan timeout agar tidak block selamanya
                Dokumen dok = antrean.poll(500, TimeUnit.MILLISECONDS);
                if (dok != null) {
                    System.out.printf("🖨️ Mencetak %s...%n", dok);
                    Thread.sleep(dok.halaman * 200L); // Simulasi cetak
                    System.out.printf("✅ Selesai mencetak %s%n", dok.nama);
                    totalDicetak++;
                }
            } catch (InterruptedException e) { return; }
        }
        System.out.println("Printer selesai. Total dicetak: " + totalDicetak);
    }

    public static void main(String[] args) throws InterruptedException {
        Thread printer = new Thread(PrinterQueue::jalankanPrinter, "Printer");
        printer.start();

        // Beberapa komputer mengirim dokumen
        ExecutorService komputer = Executors.newFixedThreadPool(3);

        String[][] dokumen = {
            {"Laporan Q1", "Alice", "5"},
            {"Presentasi", "Bob",   "10"},
            {"Invoice",    "Cici",  "2"},
            {"Kontrak",    "Dani",  "8"},
            {"CV",         "Eko",   "3"},
            {"Notulen",    "Fani",  "4"}
        };

        for (String[] d : dokumen) {
            final Dokumen dok = new Dokumen(d[0], d[1], Integer.parseInt(d[2]));
            komputer.submit(() -> {
                try {
                    System.out.printf("📄 %s mengirim: %s%n", dok.pengirim, dok.nama);
                    antrean.put(dok); // Blocking jika antrian penuh
                } catch (InterruptedException e) {
                    Thread.currentThread().interrupt();
                }
            });
            Thread.sleep(300); // Interval antar pengiriman
        }

        komputer.shutdown();
        komputer.awaitTermination(60, TimeUnit.SECONDS);

        selesai = true;
        printer.join();
        System.out.println("Semua selesai!");
    }

import java.util.concurrent.atomic.*;

/**
 * LATIHAN 3: Sistem Pemesanan Tiket Konser (Thread-Safe)
 * Banyak pengguna mencoba memesan tiket secara bersamaan.
 * Pastikan tidak terjadi overselling (tiket terjual melebihi stok).
 */
public class SistemTiket {
    static class TiketManager {
        private final String namaAcara;
        private final AtomicInteger stokTersedia;
        private final AtomicInteger totalTerjual = new AtomicInteger(0);
        private final List<String> log = Collections.synchronizedList(new ArrayList<>());

        public TiketManager(String namaAcara, int stokAwal) {
            this.namaAcara = namaAcara;
            this.stokTersedia = new AtomicInteger(stokAwal);
        }

        // Thread-safe tanpa synchronized — menggunakan CAS
        public boolean pesan(String pembeli, int jumlah) {
            while (true) {
                int stokSekarang = stokTersedia.get();
                if (stokSekarang < jumlah) {
                    log.add(String.format("GAGAL: %s tidak bisa beli %d (stok: %d)",
                            pembeli, jumlah, stokSekarang));
                    return false;
                }
                // CAS: ubah stok hanya jika belum diubah thread lain
                if (stokTersedia.compareAndSet(stokSekarang, stokSekarang - jumlah)) {
                    totalTerjual.addAndGet(jumlah);
                    log.add(String.format("✅ %s beli %d tiket (sisa: %d)",
                            pembeli, jumlah, stokSekarang - jumlah));
                    return true;
                }
                // Jika CAS gagal (thread lain mengubah stok duluan), ulangi
            }
        }

        public void cetakLaporan() {
            System.out.println("\\n=== LAPORAN: " + namaAcara + " ===");
            log.forEach(System.out::println);
            System.out.println("Total terjual : " + totalTerjual.get());
            System.out.println("Stok tersisa  : " + stokTersedia.get());
        }
    }

    public static void main(String[] args) throws InterruptedException {
        TiketManager tiket = new TiketManager("Konser Java Rocks!", 50);

        ExecutorService executor = Executors.newFixedThreadPool(10);
        Random rng = new Random();

        // 20 pengguna mencoba memesan secara bersamaan
        for (int i = 1; i <= 20; i++) {
            final String pembeli = "User-" + i;
            final int jumlah = rng.nextInt(5) + 1; // 1-5 tiket
            executor.submit(() -> {
                tiket.pesan(pembeli, jumlah);
            });
        }

        executor.shutdown();
        executor.awaitTermination(30, TimeUnit.SECONDS);

        tiket.cetakLaporan();

        // Verifikasi: totalTerjual + stokTersisa harus = 50
        // Tidak boleh ada overselling!
    }
